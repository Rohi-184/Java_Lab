<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Library Registration | New Member</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #eef2ff, #f8fafc);

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 30px;
        }

        /* MAIN FORM CARD */

        .container {
            width: 100%;
            max-width: 720px;

            background: #ffffff;

            border-radius: 22px;

            padding: 42px 50px;

            box-shadow:
                0 20px 60px rgba(15, 23, 42, 0.12);
        }

        /* HEADER */

        .header {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo {
            width: 62px;
            height: 62px;

            margin: 0 auto 18px;

            border-radius: 16px;

            background: #eff6ff;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 30px;
        }

        .header h1 {
            font-size: 28px;
            color: #0f172a;
            margin-bottom: 8px;
        }

        .header p {
            font-size: 14px;
            color: #64748b;
        }

        /* SECTION */

        .form-section {
            margin-bottom: 25px;
        }

        .section-title {
            font-size: 14px;
            font-weight: 700;

            color: #334155;

            text-transform: uppercase;

            letter-spacing: 0.6px;

            margin-bottom: 16px;
        }

        /* FORM ROW */

        .form-row {
            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 18px;

            margin-bottom: 18px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        /* LABEL */

        label {
            font-size: 13px;

            font-weight: 600;

            color: #334155;

            margin-bottom: 7px;
        }

        .required {
            color: #ef4444;
        }

        /* INPUT */

        input,
        select {

            width: 100%;

            height: 46px;

            padding: 0 14px;

            border: 1px solid #cbd5e1;

            border-radius: 10px;

            background: #ffffff;

            color: #0f172a;

            font-size: 14px;

            outline: none;

            transition: 0.2s ease;
        }

        input::placeholder {
            color: #94a3b8;
        }

        input:focus,
        select:focus {

            border-color: #2563eb;

            box-shadow:
                0 0 0 3px rgba(37, 99, 235, 0.10);
        }

        /* TERMS */

        .terms {

            display: flex;

            align-items: flex-start;

            gap: 10px;

            margin: 5px 0 22px;
        }

        .terms input {

            width: 17px;
            height: 17px;

            margin-top: 2px;

            accent-color: #2563eb;
        }

        .terms label {

            font-size: 13px;

            font-weight: 400;

            line-height: 1.5;

            color: #64748b;

            margin: 0;
        }

        .terms a {

            color: #2563eb;

            text-decoration: none;
        }

        /* BUTTON */

        .register-btn {

            width: 100%;

            height: 50px;

            border: none;

            border-radius: 10px;

            background:
                linear-gradient(135deg, #2563eb, #1d4ed8);

            color: white;

            font-size: 15px;

            font-weight: 700;

            cursor: pointer;

            transition: 0.2s ease;
        }

        .register-btn:hover {

            transform: translateY(-1px);

            box-shadow:
                0 8px 20px rgba(37, 99, 235, 0.25);
        }

        /* FOOTER */

        .footer {

            text-align: center;

            margin-top: 20px;

            font-size: 13px;

            color: #64748b;
        }

        .footer a {

            color: #2563eb;

            text-decoration: none;

            font-weight: 600;
        }

        /* RESPONSIVE */

        @media (max-width: 600px) {

            body {
                padding: 15px;
            }

            .container {

                padding: 30px 25px;

                border-radius: 18px;
            }

            .form-row {

                grid-template-columns: 1fr;
            }

            .form-group.full {

                grid-column: auto;
            }

            .header h1 {

                font-size: 24px;
            }
        }

    </style>

</head>


<body>


    <div class="container">


        <!-- HEADER -->

        <div class="header">

            <div class="logo">
                📚
            </div>

            <h1>
                New Member Registration
            </h1>

            <p>
                Create your library account by filling in the details below.
            </p>

        </div>


        <!-- FORM -->

        <form action="register" method="post">


            <!-- PERSONAL INFORMATION -->

            <div class="form-section">

                <div class="section-title">
                    Personal Information
                </div>


                <div class="form-row">


                    <div class="form-group">

                        <label>
                            Full Name
                            <span class="required">*</span>
                        </label>

                        <input
                            type="text"
                            name="name"
                            placeholder="Enter your full name"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Register Number
                            <span class="required">*</span>
                        </label>

                        <input
                            type="text"
                            name="regno"
                            placeholder="e.g. 25MCA61"
                            required
                        >

                    </div>

                </div>


                <div class="form-row">


                    <div class="form-group">

                        <label>
                            Email Address
                            <span class="required">*</span>
                        </label>

                        <input
                            type="email"
                            name="email"
                            placeholder="example@email.com"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Phone Number
                        </label>

                        <input
                            type="tel"
                            name="phone"
                            placeholder="Enter phone number"
                        >

                    </div>

                </div>

            </div>


            <!-- LIBRARY INFORMATION -->

            <div class="form-section">

                <div class="section-title">
                    Library Information
                </div>


                <div class="form-row">


                    <div class="form-group">

                        <label>
                            Membership Type
                            <span class="required">*</span>
                        </label>

                        <select name="membership" required>

                            <option value="">
                                Select membership
                            </option>

                            <option value="Student">
                                Student
                            </option>

                            <option value="Faculty">
                                Faculty
                            </option>

                            <option value="Staff">
                                Staff
                            </option>

                            <option value="Public Member">
                                Public Member
                            </option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label>
                            Department
                        </label>

                        <select name="department">

                            <option value="">
                                Select department
                            </option>

                            <option value="Computer Science">
                                Computer Science
                            </option>

                            <option value="Information Technology">
                                Information Technology
                            </option>

                            <option value="Electronics">
                                Electronics
                            </option>

                            <option value="Mechanical">
                                Mechanical
                            </option>

                            <option value="Civil">
                                Civil
                            </option>

                            <option value="Other">
                                Other
                            </option>

                        </select>

                    </div>

                </div>

            </div>

            <!-- BUTTON -->

            <button
                type="submit"
                class="register-btn"
            >
                Create Library Membership
            </button>


            <div class="footer">

                Already a member?
                <a href="#">
                    Sign in to your account
                </a>

            </div>


        </form>

    </div>


</body>

</html>
